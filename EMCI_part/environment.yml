# Conda environment for DXY Prediction Project
# Diploma Thesis: Econometric Regression Methods

name: diplom
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11
  
  # Data manipulation
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.10.0
  
  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - plotly>=5.15.0
  
  # Time series and econometrics
  - statsmodels>=0.14.0
  
  # Machine learning
  - scikit-learn>=1.3.0
  
  # Jupyter
  - jupyter
  - notebook
  - ipykernel
  
  # Utilities
  - tqdm
  - python-dotenv
  
  # Pip dependencies (not available in conda)
  - pip
  - pip:
    - yfinance>=0.2.28
    - pandas-datareader>=0.10.0
    - fredapi>=0.5.1
    - arch>=6.0.0
    - pmdarima>=2.0.3
    - loguru>=0.7.0
    - pydantic>=2.0.0

